name: Quant Engine CI

on:
  push:
    branches: ["main", "feature/production-quant-platform"]
    paths: ["quant-engine/**"]
  pull_request:
    paths: ["quant-engine/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quant-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quant-engine/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=quant-engine pytest -q
